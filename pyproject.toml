[project]
name = "wercal"
version = "0.1.0"
description = "Calibrating WER across speech datasets with item response theory"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0",
    "jiwer>=3.0",
    "pandas",
    "pyarrow",
    "whisper-normalizer",
]

[project.optional-dependencies]
asr = ["torch", "torchaudio", "transformers"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
